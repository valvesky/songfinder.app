<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2f3a"/><stop offset="1" stop-color="#0e0e10"/>
    </linearGradient>
    <radialGradient id="blue" cx="12%" cy="8%" r="75%">
      <stop offset="0" stop-color="#8caed6" stop-opacity=".75"/><stop offset="1" stop-color="#8caed6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink" cx="95%" cy="100%" r="75%">
      <stop offset="0" stop-color="#c99bbf" stop-opacity=".7"/><stop offset="1" stop-color="#c99bbf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9dce4"/>
    </linearGradient>
  </defs>

  <!-- glass tile -->
  <rect width="128" height="128" rx="30" fill="url(#base)"/>
  <rect width="128" height="128" rx="30" fill="url(#blue)"/>
  <rect width="128" height="128" rx="30" fill="url(#pink)"/>
  <rect width="128" height="128" rx="30" fill="url(#sheen)"/>
  <rect x=".75" y=".75" width="126.5" height="126.5" rx="29.25" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="1.5"/>

  <!-- note + waves: one group, centred on the tile (measured bbox ~29..108 x 30..97, shifted to centre) -->
  <g transform="translate(-4.2 1)" fill="#fff">
    <!-- head, slightly tilted like an engraved note -->
    <ellipse cx="42" cy="85" rx="14" ry="10.2" transform="rotate(-22 42 85)"/>
    <!-- stem rising from the head's right edge, with a flowing flag -->
    <path d="M52.2 83V29.5h6.2c.6 11 17.6 13.2 17.6 32.5 0 5-1.7 9.2-4.6 13 .8-9.4-5-14.8-13-18V83z"/>
    <!-- sound waves, centred on the note's optical middle -->
    <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="6">
      <path d="M87 50.5q10.5 12.5 0 25" stroke-opacity=".95"/>
      <path d="M98 40.5q17 22 0 45" stroke-opacity=".55"/>
    </g>
  </g>
</svg>
